<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" style="background:#0a192f">
<defs>
    <!-- Metallic Sword Gradient -->
  <linearGradient id="swordGradient1" x1="50%" y1="0%" x2="50%" y2="100%">
        <stop offset="0%" stop-color="#f7b731"/>
        <stop offset="100%" stop-color="#c5a642"/>
    </linearGradient>
    <linearGradient id="swordGradient" x1="50%" y1="0%" x2="50%" y2="100%">
       <stop offset="0%" stop-color="#ffd700"/>
        <stop offset="50%" stop-color="#1a4d8f"/>
        <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="bladeGlow">
        <feGaussianBlur stdDeviation="6" result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
   <linearGradient id="goldGlow" x1="50%" y1="0%" x2="50%" y2="100%">
        <stop offset="0%" stop-color="#FFD700"/>
        <stop offset="50%" stop-color="#FFB347"/>
        <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
 <filter id="circleGlow">
        <feGaussianBlur stdDeviation="15" result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>


    <!-- Sword Path -->
    <path id="sword" d="M-8-120v240h16l-4 40h-8l-4-40h16z"/>
</defs>

<!-- Animated Scale System -->
<g transform="translate(400 380)">
    <!-- Central Balance Beam -->
    <rect x="-300" y="-8" width="600" height="16" rx="8" fill="url(#swordGradient)"/>

    <!-- Left Sword Arm (A) -->
    <g transform="translate(-200 0)">
        <use href="#sword" fill="url(#swordGradient)" filter="url(#bladeGlow)">
            <animateTransform attributeName="transform" type="translate" values="0 0; 0 -30; 0 0" dur="3s" repeatCount="indefinite"/>
        </use>
        <circle cx="0" cy="120" r="60" fill="url(#swordGradient)" opacity="0.9">
            <animate attributeName="cy" values="120;90;120" dur="3s" repeatCount="indefinite"/>
        </circle>
        <text x="-20" y="140" font-family="Arial" font-size="72" fill="url(#swordGradient1)">A</text>
    </g>

    <!-- Right Sword Arm (F) -->
    <g transform="translate(200 0)">
        <use href="#sword" fill="url(#swordGradient)" filter="url(#bladeGlow)">
            <animateTransform attributeName="transform" type="translate" values="0 0; 0 30; 0 0" dur="3s" repeatCount="indefinite"/>
        </use>
        <circle cx="0" cy="120" r="60" fill="url(#swordGradient)" opacity="0.9">
            <animate attributeName="cy" values="120;150;120" dur="3s" repeatCount="indefinite"/>
        </circle>
        <text x="-10" y="160" font-family="Arial" font-size="72" fill="url(#swordGradient1)">F</text>
    </g>

    <!-- Central Sword Axis -->
    <path d="M0-200v400" stroke="#fff" stroke-width="12" stroke-linecap="round" filter="url(#bladeGlow)"/>
</g>

<!-- Dynamic Calligraphy -->
<text x="400" y="680" 
      font-family="Amiri" 
      font-size="96" 
      fill="url(#swordGradient)" 
      direction="rtl"
      text-anchor="middle">
    الْفَارُوق
</text>
  <g transform="translate(400 240)" opacity="0.6">
    <circle r="8" fill="#ffd700">
        <animate attributeName="r" values="8;12;8" dur="3s" repeatCount="indefinite"/>
    </circle>
   
    
    <path d="M0 -60l20 34.64-20 34.64-20-34.64z" fill="none" stroke="#1a4d8f" stroke-width="3"/>
</g>
   <path d="M80.832 10.368h35.328l-14.944 11.68h-57.728l-1.632-2.24-1.248-1.056-1.568-0.704-1.44-0.256-0.96-0.128-0.608 0.352-2.336 0.448-1.472-0.768-1.088 0.224-0.576 8.928h-0.8l-3.008-9.088-1.92-1.248h-16.032l-0.48 0.32-0.48 0.416-0.288 0.416h-2.88l-0.736-0.864v-5.152l1.44-0.736h2.432l0.992 1.28h15.84l3.52-1.76h14.752l0.448-0.672h4.672l1.568 1.76h29.568zM61.76 19.2v-1.248h-9.28v1.248h9.28zM65.056 19.2h33.376l-1.024-1.248h-32.352v1.248zM99.84 17.472l4-2.976v-0.672h-4.032v2.048l-0.704 0.64z" 
      transform="translate(270 290) scale(2)"
      fill="url(#swordGradient)"
      
      stroke="#0a192f"
      stroke-width="1.2"/>
   <circle cx="400" cy="400" r="360" 
        fill="none" 
        stroke="url(#goldGlow)" 
        stroke-width="4" 
        stroke-opacity="0.7"
        filter="url(#circleGlow)"/>
</svg>